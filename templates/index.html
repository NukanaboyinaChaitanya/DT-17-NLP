<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Scoring</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        input, button { margin: 10px; padding: 8px; }
    </style>
</head>
<body>

    <h2>Upload Your Resume for Scoring</h2>
    <input type="file" id="resumeInput">
    <button onclick="uploadResume()">Upload & Get Score</button>
    <h3 id="result"></h3>
    <pre id="wordCounts"></pre>

    <script>
        function uploadResume() {
            let fileInput = document.getElementById("resumeInput");
            if (fileInput.files.length === 0) {
                alert("Please select a file to upload.");
                return;
            }

            let formData = new FormData();
            formData.append("resume", fileInput.files[0]);

            fetch("/score", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("result").innerText = "Error: " + data.error;
                } else {
                    document.getElementById("result").innerText = "Resume Score: " + data.score;
                    document.getElementById("wordCounts").innerText = JSON.stringify(data.word_frequencies, null, 2);
                }
            })
            .catch(error => {
                document.getElementById("result").innerText = "Upload failed. Please try again.";
                console.error("Error:", error);
            });
        }
    </script>

</body>
</html>
